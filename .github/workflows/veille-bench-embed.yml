# Banc d'essai de l'embedding — mesure ponctuelle, déclenchée à la main.
#
# Pourquoi un workflow séparé du passage quotidien : l'installation de torch et
# le téléchargement de BGE-M3 pèsent plus de 2 Go et plusieurs minutes. Sur un
# budget de 2000 minutes/mois facturées à la minute entamée PAR EXÉCUTION, ce
# coût ne doit être payé qu'une fois, pas tous les jours.
#
# Ce qu'il tranche : le débit d'embedding sur un runner 2 cœurs — la seule
# hypothèse non mesurée du dimensionnement. Une mesure sur poste de développeur
# la SURESTIME (4 à 8 cœurs) ; seul ce runner donne le chiffre utilisable.

name: veille — banc d'essai embedding

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le cache du modèle évite de retélécharger 2,2 Go à chaque relance.
      - name: Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v1

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          # Index CPU explicite : la roue par défaut embarque CUDA (~2,5 Go)
          # dont un runner sans GPU n'a aucun usage.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r veille/requirements-nlp.txt
          pip install -r veille/requirements.txt

      - name: Mesurer
        run: python veille/bench_embed.py
