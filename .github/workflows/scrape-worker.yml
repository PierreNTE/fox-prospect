name: scrape-worker

# Déclencheurs :
#  - schedule : cron en UTC (jamais d'heure locale). '0 */6 * * *' = toutes les 6 h.
#               ⚠️ GitHub DÉSACTIVE les crons après 60 jours sans activité sur le repo.
#               Un push ou un "Run workflow" manuel les réactive.
#  - workflow_dispatch : bouton "Run workflow" dans l'onglet Actions (test manuel).
#  - repository_dispatch (type 'scrape') : déclenché par l'app via POST /api/scrape/enqueue.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [scrape]

# Empêche deux runs de traiter la même file en parallèle.
concurrency:
  group: scrape-worker
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # nécessaire à l'alerte d'échec (création d'une issue)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/contact-sources/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r scripts/contact-sources/requirements.txt

      - name: Installer le navigateur Scrapling
        run: scrapling install
        # Si le navigateur ne se lance pas sur le runner (bibliothèques manquantes),
        # décommenter l'étape ci-dessous :
        # - name: Dépendances système navigateur
        #   run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libx11-xcb1 libasound2t64

      - name: Lancer le worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          # Plafonds (optionnels) — sinon défauts du worker (5 jobs / 8 profils).
          SCRAPE_JOB_BATCH: ${{ vars.SCRAPE_JOB_BATCH }}
          SCRAPE_PROFILE_LIMIT: ${{ vars.SCRAPE_PROFILE_LIMIT }}
        run: python scripts/contact-sources/worker.py

      - name: Alerte en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 scrape-worker en échec — run ${context.runId}`,
              body: `Le worker de scraping a échoué (infra, pas un simple blocage de source).\n\nVoir le run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
