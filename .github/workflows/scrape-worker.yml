name: scrape-worker

# Déclencheurs :
#  - schedule : toutes les 15 min, un contrôle de quelques secondes regarde s'il
#               reste des recherches de leads en file (site officiel, décideurs).
#               Le worker ne démarre que s'il y a du travail : après l'import du
#               lundi, la recherche commence dans le quart d'heure, sans jeton à
#               configurer. Dépôt public = minutes GitHub Actions gratuites.
#               ⚠️ GitHub DÉSACTIVE les crons après 60 jours sans activité sur le repo.
#               Un push ou un "Run workflow" manuel les réactive.
#  - workflow_dispatch : bouton "Run workflow" dans l'onglet Actions (test manuel).
#  - repository_dispatch (types scrape / leads) : lancement immédiat par l'app si
#               GITHUB_DISPATCH_TOKEN est configuré dans Vercel (facultatif).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [scrape, leads]

permissions:
  contents: read
  issues: write   # nécessaire à l'alerte d'échec (création d'une issue)

jobs:
  # Contrôle léger : n'affiche qu'un nombre, jamais de nom de société.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.q.outputs.run }}
    steps:
      - id: q
        env:
          EVENT: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INCLUDE_AUTO: ${{ vars.SCRAPE_INCLUDE_AUTO }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Lancement manuel ou par l'app."; exit 0; fi
          filter="status=eq.pending&or=(kind.eq.find_website,created_by.eq.leads-agent)"
          if [ "$INCLUDE_AUTO" = "true" ]; then filter="status=eq.pending"; fi
          range=$(curl -sS --max-time 20 -o /dev/null -D - \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Prefer: count=exact" -H "Range: 0-0" \
            "$SUPABASE_URL/rest/v1/scrape_jobs?select=id&$filter" | tr -d '\r' | grep -i '^content-range:' || true)
          n="${range##*/}"
          case "$n" in ''|*[!0-9]*) echo "::warning::File de recherche illisible — on réessaie dans 15 min."; n=0 ;; esac
          echo "Recherches en file : $n"
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  scrape:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Un seul worker à la fois sur la file ; un passage suivant attend son tour.
    concurrency:
      group: scrape-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/contact-sources/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r scripts/contact-sources/requirements.txt

      - name: Installer le navigateur Scrapling
        run: scrapling install
        # Si le navigateur ne se lance pas sur le runner (bibliothèques manquantes),
        # décommenter l'étape ci-dessous :
        # - name: Dépendances système navigateur
        #   run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libx11-xcb1 libasound2t64

      # Moteur de recherche local et gratuit (SearXNG) : remplace Brave Search
      # (payant depuis 2026). Vit le temps du run, sur le runner, jamais exposé.
      - name: Démarrer le moteur de recherche local (SearXNG)
        continue-on-error: true
        run: |
          mkdir -p /tmp/searxng && cp scripts/searxng/settings.yml /tmp/searxng/settings.yml
          docker run -d --name searxng -p 8888:8080 -v /tmp/searxng:/etc/searxng \
            -e SEARXNG_BASE_URL=http://localhost:8888/ searxng/searxng:latest
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:8888/search?q=test&format=json" -o /dev/null; then echo "SearXNG prêt"; exit 0; fi
            sleep 3
          done
          echo "::warning::SearXNG n'a pas démarré — repli sur les autres sources."
          docker logs searxng 2>&1 | tail -20

      - name: Lancer le worker
        env:
          SEARXNG_URL: http://localhost:8888
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Mode 100 % gratuit : les services potentiellement payants ne sont
          # transmis que si tu les autorises explicitement (Settings → Variables) :
          #  - PROXY_ALLOWED=true  → proxy résidentiel SCRAPE_PROXY (souvent payant)
          #  - BRAVE_ALLOWED=true  → Brave Search API (payante au-delà des crédits offerts)
          SCRAPE_PROXY: ${{ vars.PROXY_ALLOWED == 'true' && secrets.SCRAPE_PROXY || '' }}
          BRAVE_API_KEY: ${{ vars.BRAVE_ALLOWED == 'true' && secrets.BRAVE_API_KEY || '' }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          # Plafonds (optionnels) — sinon défauts du worker (5 jobs / 8 profils).
          SCRAPE_JOB_BATCH: ${{ vars.SCRAPE_JOB_BATCH }}
          SCRAPE_PROFILE_LIMIT: ${{ vars.SCRAPE_PROFILE_LIMIT }}
          FIND_SITE_BATCH: ${{ vars.FIND_SITE_BATCH }}
          # Prospection = leads Salesforce uniquement. La recherche sur les anciens
          # comptes suivis (veille) ne reprend que si SCRAPE_INCLUDE_AUTO=true.
          SCRAPE_INCLUDE_AUTO: ${{ vars.SCRAPE_INCLUDE_AUTO }}
        run: python scripts/contact-sources/worker.py

      # Les décideurs trouvés passent tout de suite sur la fiche du lead (contact
      # + accroche régénérée), sans attendre le passage des 2 h.
      - name: Mettre à jour les fiches des leads
        continue-on-error: true
        env:
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://fox-prospect.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET absent — fiches mises à jour au prochain passage."; exit 0; fi
          resp=$(curl -sS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/leads-intel")
          echo "$resp" | jq '{contacts_ajoutes: .housekeeping.contacts_added, doublons_fusionnes: .housekeeping.merged, error}' 2>/dev/null || echo "Réponse inattendue (non JSON)."

      - name: Alerte en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 scrape-worker en échec — run ${context.runId}`,
              body: `Le worker de scraping a échoué (infra, pas un simple blocage de source).\n\nVoir le run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
