name: veille-daily

# Passage quotidien UNIQUE de la veille commerciale.
#
# Pourquoi un seul passage et non quatre : GitHub facture à la minute entière,
# PAR EXÉCUTION. Mesuré sur ce dépôt, process-jobs-worker consomme ~365 min/mois
# pour ~60 min de calcul réel — près de la moitié de la facture est de l'arrondi.
# La fréquence coûte donc plus cher que la durée, et la fraîcheur attendue
# (24 h) autorise à tout concentrer. C'est aussi ce qui rend le cache des
# modèles rentable : BGE-M3 pèse plus de 2 Go.
#
# Budget : ~880 min/mois déjà consommées par les workers existants sur les
# 2 000 offertes. Cible pour la veille : 900 min/mois, soit ~29 min/jour.
#
# ⚠️ GitHub DÉSACTIVE les crons après 60 jours sans activité sur le dépôt.
# Pour un module de veille c'est le pire mode de défaillance : une collecte
# arrêtée est indiscernable de « rien ne se passe chez mes comptes ». D'où
# l'étape de signal de vie en fin de passage.

on:
  # Veille quotidienne désactivée : l'appli est recentrée sur la prospection des
  # leads (contact + accroche + existence). Lancement manuel toujours possible.
  # schedule:
  #   - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ne rien écrire, afficher seulement"
        type: boolean
        default: false
  repository_dispatch:
    types: [veille]

concurrency:
  group: veille-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write               # nécessaire à l'alerte d'échec

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 35       # plafond de sécurité ; cible ~26 min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: veille/requirements.txt

      - name: Installer les dépendances
        run: pip install -r veille/requirements.txt

      # Le cache des modèles est ce qui rend le budget tenable. Il n'est utile
      # qu'une fois les briques NLP activées ; inoffensif d'ici là.
      - name: Restaurer le cache des modèles
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: veille-modeles-bge-m3-v1

      - name: Passage de veille
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Étage de jugement. Sans cette clé, le passage tourne à l'identique
          # sans jugement IA : les signaux fragiles sont écrits tels quels, avec
          # leur provenance affichée « à vérifier ».
          # Mode 100 % gratuit : la clé IA n'est transmise que si AI_ENABLED=true
          # (Settings → Variables). Sans clé, la veille tourne sans jugement IA.
          ANTHROPIC_API_KEY: ${{ vars.AI_ENABLED == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          MONTHLY_BUDGET_EUR: ${{ vars.MONTHLY_BUDGET_EUR }}
          # Plafonds — seconde barrière derrière le kill-switch mensuel.
          VEILLE_MAX_LLM: ${{ vars.VEILLE_MAX_LLM }}
          VEILLE_MAX_DOCS: ${{ vars.VEILLE_MAX_DOCS }}
          VEILLE_FENETRE_JOURS: ${{ vars.VEILLE_FENETRE_JOURS }}
          # Fenêtre des salles de presse, bien plus large : elles publient
          # quelques fois par mois là où TED publie tous les jours.
          VEILLE_FENETRE_PRESSE: ${{ vars.VEILLE_FENETRE_PRESSE }}
          VEILLE_PAYS: ${{ vars.VEILLE_PAYS }}
        run: |
          python veille/run.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # ── Vectorisation ────────────────────────────────────────────────────
      # Étape SÉPARÉE, et après la collecte, pour deux raisons : torch pèse plus
      # de 2 Go (on ne l'installe qu'une fois le contenu du jour déjà en base),
      # et `continue-on-error` garantit qu'une roue Python cassée ne fait pas
      # échouer un passage dont l'essentiel — la collecte — a réussi.
      #
      # Ce que l'on perd alors est la recherche sémantique du jour, pas les
      # signaux : l'anti-jointure rattrape les vecteurs manquants au passage
      # suivant.
      - name: Installer les briques NLP
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: pip install -r veille/requirements-nlp.txt

      - name: Vectorisation
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VEILLE_MAX_EMBED: ${{ vars.VEILLE_MAX_EMBED }}
        run: python veille/run.py --embed

      # Signal de vie : ce qui alerte, c'est le ping qui CESSE d'arriver — un
      # cron désactivé par GitHub après 60 jours n'échoue pas, il se tait, et
      # aucune alerte d'échec ne peut voir ça.
      #
      # Le détecteur vit chez Vercel (/api/health → services.veille, seuil 48 h),
      # pas ici : GitHub ne peut pas signaler qu'il a coupé son propre cron.
      # Le secret passe par l'en-tête et jamais par l'URL, qui se retrouverait
      # dans les journaux d'accès de tout ce qu'elle traverse.
      - name: Signal de vie
        if: success() && vars.VEILLE_HEARTBEAT_URL != ''
        run: |
          curl -fsS --max-time 10 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.VEILLE_HEARTBEAT_URL }}?run=${{ github.run_id }}" || true

      - name: Alerte en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Veille : échec du passage du ${new Date().toISOString().slice(0, 10)}`,
              body: [
                'Le passage quotidien de veille a échoué.',
                '',
                `Exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Le pipeline est idempotent : relancer le workflow reprend là où il',
                'sest arrêté, sans créer de doublon.',
              ].join('\n'),
              labels: ['veille'],
            })
