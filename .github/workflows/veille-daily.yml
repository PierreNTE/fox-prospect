name: veille-daily

# Passage quotidien UNIQUE de la veille commerciale.
#
# Pourquoi un seul passage et non quatre : GitHub facture à la minute entière,
# PAR EXÉCUTION. Mesuré sur ce dépôt, process-jobs-worker consomme ~365 min/mois
# pour ~60 min de calcul réel — près de la moitié de la facture est de l'arrondi.
# La fréquence coûte donc plus cher que la durée, et la fraîcheur attendue
# (24 h) autorise à tout concentrer. C'est aussi ce qui rend le cache des
# modèles rentable : BGE-M3 pèse plus de 2 Go.
#
# Budget : ~880 min/mois déjà consommées par les workers existants sur les
# 2 000 offertes. Cible pour la veille : 900 min/mois, soit ~29 min/jour.
#
# ⚠️ GitHub DÉSACTIVE les crons après 60 jours sans activité sur le dépôt.
# Pour un module de veille c'est le pire mode de défaillance : une collecte
# arrêtée est indiscernable de « rien ne se passe chez mes comptes ». D'où
# l'étape de signal de vie en fin de passage.

on:
  schedule:
    - cron: '30 4 * * *'      # 04:30 UTC — avant la journée de travail
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ne rien écrire, afficher seulement"
        type: boolean
        default: false
  repository_dispatch:
    types: [veille]

concurrency:
  group: veille-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write               # nécessaire à l'alerte d'échec

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 35       # plafond de sécurité ; cible ~26 min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: veille/requirements.txt

      - name: Installer les dépendances
        run: pip install -r veille/requirements.txt

      # Le cache des modèles est ce qui rend le budget tenable. Il n'est utile
      # qu'une fois les briques NLP activées ; inoffensif d'ici là.
      - name: Restaurer le cache des modèles
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: veille-modeles-bge-m3-v1

      - name: Passage de veille
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Plafonds — seconde barrière derrière le kill-switch mensuel.
          VEILLE_MAX_LLM: ${{ vars.VEILLE_MAX_LLM }}
          VEILLE_MAX_DOCS: ${{ vars.VEILLE_MAX_DOCS }}
          VEILLE_FENETRE_JOURS: ${{ vars.VEILLE_FENETRE_JOURS }}
          VEILLE_PAYS: ${{ vars.VEILLE_PAYS }}
        run: |
          python veille/run.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # Signal de vie : un service de surveillance de tâches planifiées alerte
      # quand le ping CESSE d'arriver — ce qu'aucune alerte d'échec ne peut
      # détecter, puisqu'un cron désactivé n'échoue pas, il se tait.
      - name: Signal de vie
        if: success() && vars.VEILLE_HEARTBEAT_URL != ''
        run: curl -fsS --max-time 10 "${{ vars.VEILLE_HEARTBEAT_URL }}" || true

      - name: Alerte en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Veille : échec du passage du ${new Date().toISOString().slice(0, 10)}`,
              body: [
                'Le passage quotidien de veille a échoué.',
                '',
                `Exécution : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Le pipeline est idempotent : relancer le workflow reprend là où il',
                'sest arrêté, sans créer de doublon.',
              ].join('\n'),
              labels: ['veille'],
            })
